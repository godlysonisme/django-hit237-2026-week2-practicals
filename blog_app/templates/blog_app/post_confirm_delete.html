{% extends "base.html" %}
 
 
{% block content %}
<div style="max-width: 600px; margin: 2rem auto; padding: 2rem; background-color: #fff3cd; border: 1px solid #ffc107; border-radius: 4px;">
    <h1 style="color: #856404; margin-bottom: 1rem;">Delete Post?</h1>
    
    <p style="color: #856404; margin-bottom: 1.5rem;">
        Are you sure you want to delete the following post?
    </p>
 
 
    <div style="background-color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; border-left: 4px solid #dc3545;">
        <h2 style="color: #333; margin-bottom: 0.5rem;">{{ post.title }}</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 0.5rem;">
            Published: {{ post.published_date|date:"F d, Y" }}
        </p>
        <p style="color: #555; margin-bottom: 0;">
            {{ post.content|truncatewords:20 }}
        </p>
    </div>
 
 
    <p style="color: #856404; font-weight: bold; margin-bottom: 1.5rem;">
        This action cannot be undone.
    </p>
 
 
    <form method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" style="padding: 0.75rem 1.5rem; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-right: 1rem;">
            Delete Post
        </button>
    </form>
 
 
    <a href="{% url 'post_details' post.pk %}" style="padding: 0.75rem 1.5rem; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">
        Cancel
    </a>
</div>
{% endblock %}
