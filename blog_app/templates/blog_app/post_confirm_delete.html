{% extends "base.html" %}
 
 
{% block content %}
<div class="alert alert-warning" style="max-width: 600px; margin: 2rem auto; padding: 2rem;">
    <h1 class="mb-1" style="color: #856404;">Delete Post?</h1>
    
    <p class="mb-2" style="color: #856404;">
        Are you sure you want to delete the following post?
    </p>
 
 
    <div class="card" style="margin-bottom: 1.5rem; border-left: 4px solid #dc3545;">
        <h2 class="mb-1">{{ post.title }}</h2>
        <p class="card-meta mb-1">Published: {{ post.published_date|date:"F d, Y" }}</p>
        <p class="mb-1" style="color: #555;">{{ post.content|truncatewords:20 }}</p>
    </div>
 
 
    <p class="mb-2" style="color: #856404; font-weight: bold;">This action cannot be undone.</p>
 
 
    <form method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Post</button>
    </form>
 
 
    <a href="{% url 'post_details' post.pk %}" class="btn btn-secondary">Cancel</a>
</div>
{% endblock %}
