{% extends "base.html" %}
 
 
{% block content %}
<a href="{% url 'post_list' %}" class="btn btn-secondary mb-1">← Back to Posts</a>
 
 
<h1 class="mb-1">{{ post.title }}</h1>
<p class="card-meta mb-1">Published on: {{ post.published_date|date:"F d, Y \a\t g:i A" }}</p>
 
 
<div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
    <a href="{% url 'post_update' post.pk %}" class="btn btn-warning" style="font-size: 0.9rem;">Edit</a>
    <a href="{% url 'post_delete' post.pk %}" class="btn btn-danger" style="font-size: 0.9rem;">Delete</a>
</div>
 
 
<hr class="mb-2">
 
 
<div style="line-height: 1.8; color: #333;">
    {{ post.content|linebreaks }}
</div>
{% endblock %}
