{% extends "base.html" %}
 
 
{% block content %}
<a href="{% url 'post_list' %}" style="display: inline-block; margin-bottom: 1rem; padding: 0.5rem 1rem; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px;">
    ← Back to Posts
</a>
 
 
<h1 style="margin-bottom: 0.5rem;">{{ post.title }}</h1>
<p style="color: #666; margin-bottom: 1rem;">Published on: {{ post.published_date|date:"F d, Y \a\t g:i A" }}</p>
 
 
<div style="margin-bottom: 1.5rem; display: flex; gap: 0.5rem;">
    <a href="{% url 'post_update' post.pk %}" style="padding: 0.5rem 1rem; background-color: #ffc107; color: black; text-decoration: none; border-radius: 4px; font-size: 0.9rem;">
        Edit
    </a>
    <a href="{% url 'post_delete' post.pk %}" style="padding: 0.5rem 1rem; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; font-size: 0.9rem;">
        Delete
    </a>
</div>
 
 
<hr style="margin-bottom: 1.5rem;">
 
 
<div style="line-height: 1.8; color: #333;">
    {{ post.content|linebreaks }}
</div>
{% endblock %}
